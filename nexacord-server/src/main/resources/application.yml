####################
# 服务端口
####################
server:
  port: 8080

####################
# 应用与框架
####################
spring:
  config:
    import: optional:file:./application-local.yml

  application:
    name: nexacord-server

  ####################
  # 数据库和持久化
  ####################
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexacord?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  ####################
  # 邮件验证码
  ####################
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:cctnetwork@163.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # dialect: org.hibernate.dialect.MySQLDialect

  ####################
  # 缓存
  ####################
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

  ####################
  # 网页路由
  ####################
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  ####################
  # 时区和数据格式
  ####################
  jackson:
    time-zone: Asia/Shanghai

####################
# 令牌
####################
jwt:
  secret: ${JWT_SECRET:kfndORz7eM0MhZJ837YhYNyxqZO6O4zLgOjY7GROQwSLBdaACmb+wz2VSD2SrXo2uTYivZf0Ji0O3BLd4XQseg==}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

####################
# 七牛云对象存储
####################
qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:nexacord}
  domain: ${QINIU_DOMAIN:oss2.cctstudio.cn}
  use-https: ${QINIU_USE_HTTPS:true}
  private-bucket: ${QINIU_PRIVATE_BUCKET:false}
  region: ${QINIU_REGION:auto}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    org.springframework.web.servlet.mvc.method.annotation: ${LOG_LEVEL_SPRING_MVC:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
